name: Build and Promote Docker Image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Start Docker Build
        run: |
          echo "======================================"
          echo "Starting Docker Build"
          echo "Environment: ${{ inputs.environment }}"
          echo "======================================"

      - name: Simulate Docker Build
        run: |
          echo "Building Docker image..."
          sleep 10
          echo "Docker build completed"

      - name: Simulate Docker Promote
        run: |
          echo "Promoting Docker image..."
          sleep 10
          echo "Docker image promoted successfully"

      - name: Generate Docker Tag
        run: |
          TAG="1.0.${GITHUB_RUN_NUMBER}"

          echo "======================================"
          echo "Generated Docker Tag: $TAG"
          echo "======================================"
